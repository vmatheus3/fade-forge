 <path d="M107 205l23-28 25 28" class="line"/>
 <rect x="101" y="208" width="59" height="37" rx="7" stroke="#ffdf9d" stroke-width="4" fill="none"/>
 <path d="M168 207v20a14 14 0 0 0 28 0v-20a14 14 0 0 0-28 0z" fill="#48c79b"/>
 <path d="M178 207v-6a4 4 0 0 1 8 0v6" stroke="#48c79b" stroke-width="5" fill="none"/>
 <text x="131" y="309" class="s" text-anchor="middle" font-size="15">Original stays saved</text>
</g>
<g transform="translate(887,226)">
 <rect width="262" height="330" rx="20" class="panel"/>
 <circle cx="36" cy="40" r="23" fill="#f4bc62"/><text x="36" y="49" text-anchor="middle" font-weight="800" font-size="28" fill="#141721">4</text>
 <text x="24" y="98" class="t" font-size="25" font-weight="800">Start sending clips</text>
 <text x="24" y="129" class="s" font-size="17">Chat with Codex</text>
 <g transform="translate(22,167)"><rect x="0" y="0" width="63" height="95" rx="10" stroke="#777f94" stroke-width="2" fill="#253049"/><rect x="77" y="0" width="63" height="95" rx="10" stroke="#777f94" stroke-width="2" fill="#253049"/><rect x="154" y="0" width="63" height="95" rx="10" stroke="#eab760" stroke-width="2" fill="#253049"/>
 <circle cx="31" cy="39" r="16" fill="#bd9e86"/><path d="M10 81q22-36 43 0" fill="#171b21"/>
 <circle cx="108" cy="39" r="16" fill="#bd9e86"/><path d="M87 81q22-36 43 0" fill="#171b21"/><path d="M91 28l32 26" stroke="#f4bc62" stroke-width="4"/>
 <circle cx="185" cy="39" r="16" fill="#bd9e86"/><path d="M164 81q22-36 43 0" fill="#171b21"/>
 </g>
 <text x="131" y="309" class="s" text-anchor="middle" font-size="15">Before · During · After</text>
</g>
<path d="M314 393h13 M593 393h13 M872 393h13" class="line"/>
<rect x="50" y="583" width="1099" height="69" rx="15" fill="#212634" stroke="#434d61"/>
<text x="600" y="612" class="t" font-size="21" text-anchor="middle" font-weight="700">Everything runs locally on your Mac through Codex.</text>
<text x="600" y="639" class="s" font-size="18" text-anchor="middle">No cloud renderer · No extra subscription · No external video service</text>
</svg>
