 <text x="24" y="98" class="t" font-size="25" font-weight="800">Open local Codex</text>
 <text x="24" y="129" class="s" font-size="17">On your own Mac</text>
 <rect x="34" y="154" width="194" height="112" rx="12" fill="#0b0f18" stroke="#65758b" stroke-width="3"/>
 <rect x="46" y="168" width="170" height="81" rx="5" fill="#263246"/>
 <circle cx="131" cy="207" r="26" fill="#f0b653"/><path d="M119 207l10 10 17-22" fill="none" stroke="#0b0f18" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M18 275H245L230 289H32Z" fill="#8190a4"/>
 <text x="131" y="309" class="s" text-anchor="middle" font-size="15">Use a new workspace</text>
</g>
<g transform="translate(329,226)">
 <rect width="262" height="330" rx="20" class="panel"/>
 <circle cx="36" cy="40" r="23" fill="#f4bc62"/><text x="36" y="49" text-anchor="middle" font-weight="800" font-size="28" fill="#141721">2</text>
 <text x="24" y="98" class="t" font-size="25" font-weight="800">Paste one prompt</text>
 <text x="24" y="129" class="s" font-size="17">Codex sets it up</text>
 <rect x="20" y="155" width="222" height="119" rx="13" fill="#0b0f18" stroke="#52647d"/>
 <text x="35" y="181" fill="#77a7f3" font-size="15" font-weight="700">YOU TO CODEX</text>
 <text x="35" y="208" class="t" font-size="15">Set up FadeForge from</text>
 <text x="35" y="233" class="gold" font-size="14">github.com/vmatheus3/</text>
 <text x="35" y="254" class="gold" font-size="14">fade-forge</text>
 <text x="131" y="309" class="s" text-anchor="middle" font-size="15">No separate editor</text>
</g>
<g transform="translate(608,226)">
 <rect width="262" height="330" rx="20" class="panel"/>
 <circle cx="36" cy="40" r="23" fill="#f4bc62"/><text x="36" y="49" text-anchor="middle" font-weight="800" font-size="28" fill="#141721">3</text>
 <text x="24" y="98" class="t" font-size="25" font-weight="800">Send your logo</text>
 <text x="24" y="129" class="s" font-size="17">Only the first time</text>
