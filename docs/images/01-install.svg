<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-label="FadeForge illustrated setup in four steps: open local Codex on your Mac, paste the repository prompt, share your logo, then upload barber clips. Not an actual application screenshot.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10131d"/><stop offset="1" stop-color="#080c14"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e4a740"/><stop offset="1" stop-color="#ffdc92"/></linearGradient>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}.t{fill:#f8fafc}.s{fill:#aab4c8}.gold{fill:#ffd68a}.panel{fill:#171d2c;stroke:#3a465b;stroke-width:2}.line{stroke:#e4ae59;stroke-width:5;stroke-linecap:round;fill:none}</style>
</defs>
<rect width="1200" height="690" fill="url(#bg)"/>
<rect width="1200" height="8" fill="url(#accent)"/>
<text x="55" y="82" class="gold" font-size="24" font-weight="700" letter-spacing="3">FADEFORGE</text>
<text x="55" y="140" class="t" font-size="51" font-weight="800">Install once. Edit in Codex.</text>
<text x="55" y="180" class="s" font-size="23">Four illustrated steps for a barber with no technical experience</text>

<g transform="translate(50,226)">
 <rect width="262" height="330" rx="20" class="panel"/>
